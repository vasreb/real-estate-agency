name: agency-base
services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agency
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agency-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: pgvector/pgvector:pg18-trixie
    profiles: ["test"]
    environment:
      POSTGRES_USER: agency_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
      POSTGRES_DB: agency_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agency-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_test -d agency_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  agency-data:
  agency-test-data:
