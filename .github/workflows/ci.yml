# Runs exactly the local `pnpm verify` (lint, format, typecheck, architecture,
# contract drift, unit, PostgreSQL integration, production-build E2E).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: ci-only-dev-password
          POSTGRES_DB: agency
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency -d agency"
          --health-interval 2s --health-timeout 3s --health-retries 30
      postgres-test:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: agency_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: agency_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agency_test -d agency_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # CI-only throwaway credentials for ephemeral service containers.
      DATABASE_URL: postgresql://agency:ci-only-dev-password@127.0.0.1:5432/agency
      TEST_DATABASE_URL: postgresql://agency_test:ci-only-test-password@127.0.0.1:5433/agency_test
      PUBLIC_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:3001
      SESSION_TTL_SECONDS: "28800"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agency/web exec playwright install --with-deps chromium
      - run: pnpm verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
